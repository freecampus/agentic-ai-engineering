[project]
name = "freecampus-agents"
version = "0.1.0"
description = "Deterministic learning tools for FreeCampus Agentic AI Engineering."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{ name = "Ivan Ogasawara" }]
keywords = ["education", "agents", "agentic-ai", "open-science"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
dependencies = []

[project.urls]
Homepage = "https://freecampus.github.io/agentic-ai-engineering/"
Repository = "https://github.com/freecampus/agentic-ai-engineering"
Issues = "https://github.com/freecampus/agentic-ai-engineering/issues"

[project.optional-dependencies]
notebooks = ["ipywidgets>=8,<9", "ipykernel>=6,<8"]

[dependency-groups]
dev = [
  "click>=8",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "mypy>=1.17,<3",
  "PyYAML>=6,<7",
  "types-PyYAML>=6,<7",
  "makim==1.29.0",
  "pre-commit>=4,<5",
  "pre-commit-hooks==4.6.0",
  "nbformat>=5,<6",
  "tomli>=2,<3; python_version < '3.11'",
  "quarto-cli==1.9.38"
]

[build-system]
requires = ["poetry-core>=2.4,<3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
requires-poetry = ">=2.4,<3"
packages = [{ include = "freecampus_agents", from = "src" }]
include = [
  { path = "src/freecampus_agents/py.typed", format = ["sdist", "wheel"] },
  { path = "src/freecampus_agents/fixtures/*.json", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
# Bound dependency resolution without restricting the published package metadata.
python = ">=3.10,<4"

[tool.poetry.group.docs]
optional = true

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["ipywidgets.*"]
ignore_missing_imports = true
