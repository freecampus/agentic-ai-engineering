[project]
name = "freecampus-agents"
version = "0.1.0"
description = "Deterministic learning tools for FreeCampus Agentic AI Engineering."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{ name = "Ivan Ogasawara" }]
keywords = ["education", "agents", "agentic-ai", "open-science"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
dependencies = []

[project.urls]
Homepage = "https://freecampus.github.io/agentic-ai-engineering/"
Repository = "https://github.com/freecampus/agentic-ai-engineering"
Issues = "https://github.com/freecampus/agentic-ai-engineering/issues"

[project.optional-dependencies]
notebooks = ["ipywidgets>=8,<9", "ipykernel>=6,<8"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "mypy>=1.17,<3",
  "PyYAML>=6,<7",
  "types-PyYAML>=6,<7",
  "makim==1.29.0",
  "pre-commit>=4,<5",
  "nbformat>=5,<6",
]
docs = ["quarto-cli==1.9.38"]

[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freecampus_agents = ["py.typed", "fixtures/*.json"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["ipywidgets.*"]
ignore_missing_imports = true
