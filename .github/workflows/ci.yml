name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    defaults:
      run:
        shell: bash -el {0}
    env:
      POETRY_VIRTUALENVS_CREATE: "false"
      POETRY_VIRTUALENVS_IN_PROJECT: "false"
      POETRY_NO_INTERACTION: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the matrix Conda environment
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        # Keep the local 3.12 default; do not combine it with an action override.
        # Only shell tooling is needed before the Conda environment exists.
        run: |
          mkdir -p .cache
          awk -v version="$PYTHON_VERSION" '
            /^[[:space:]]*-[[:space:]]*python([=<>!~[:space:]]|$)/ {
              print "  - python=" version
              count++
              next
            }
            { print }
            END {
              if (count != 1) {
                print "Expected exactly one Python dependency in conda.yaml" > "/dev/stderr"
                exit 1
              }
            }
          ' conda.yaml > .cache/conda-ci.yaml
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: .cache/conda-ci.yaml
          activate-environment: fc-agentic
          auto-activate-base: false
          channels: conda-forge,nodefaults
          conda-solver: libmamba
      - name: Verify Conda and Poetry use the same environment
        run: python scripts/check_environment.py
      - name: Install course and development tools
        # Bootstrap migration: require `poetry check --lock` once the lock is committed.
        run: |
          poetry check --strict
          poetry install --all-extras --with docs
          python scripts/check_environment.py
      - name: Lint, test, package, and render
        run: poetry run makim all.ci
