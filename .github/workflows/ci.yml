name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}
      - name: Install Just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - name: Set up Node.js for Prettier
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups --all-extras
      - name: Check Justfile formatting
        run: just --fmt --check
      - name: Lint, test, package, and render
        run: just ci
