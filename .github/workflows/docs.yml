name: Documentation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -el {0}
    env:
      POETRY_VIRTUALENVS_CREATE: "false"
      POETRY_VIRTUALENVS_IN_PROJECT: "false"
      POETRY_NO_INTERACTION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: conda.yaml
          activate-environment: fc-agentic
          auto-activate-base: false
          channels: conda-forge,nodefaults
          conda-solver: libmamba
          python-version: "3.12"
      - name: Verify Conda and Poetry use the same environment
        run: python scripts/check_environment.py
      - name: Install documentation tools
        # Bootstrap migration: require `poetry check --lock` once the lock is committed.
        run: |
          poetry check --strict
          poetry install --with docs
          python scripts/check_environment.py
      - name: Render and export notebooks
        run: poetry run makim docs.build
      - uses: actions/upload-artifact@v4
        with:
          name: course-site
          path: docs/_site
  publish:
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: course-site
          path: docs/_site
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/_site
          force_orphan: true
