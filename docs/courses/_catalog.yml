    capstone:
      id: defensible-agentic-system
      title: Ship a Defensible Agentic System
      status: planned
      path: courses/agentic-ai-engineering/capstone/index.qmd
      estimated_effort: 40–70 hours
      stages:
        - id: C1
          title: Select the Problem and Establish the Baseline
          summary:
            Choose a safe, consequential, multi-step task; identify stakeholders and harms;
            build the simplest non-agentic baseline; and define success, budgets, and forbidden
            actions.
        - id: C2
          title: Design Architecture, Evaluation, and Threat Model
          summary:
            Submit system/data-flow diagrams, architecture decisions, evaluation data plan,
            metric definitions, threat model, autonomy policy, and open-source license review
            before implementation expands.
        - id: C3
          title: Build the Vertical Slice
          summary:
            Complete one end-to-end task through API, agent runtime, model, tool, state,
            trace, and evaluation. Demonstrate local/open-model execution and deterministic fixture
            mode.
        - id: C4
          title: Add Reliability and Security
          summary:
            Implement persistence, recovery, idempotency, budgets, sandboxing, scoped credentials,
            adversarial tests, human intervention, and telemetry redaction.
        - id: C5
          title: Evaluate and Simplify
          summary:
            Run held-out quality, robustness, safety, latency, cost, and human-effort evaluations.
            Remove any agent, memory, planning, or protocol layer that does not improve the declared
            frontier.
        - id: C6
          title: Release and Defend
          summary:
            Perform a canary or simulated release, respond to one injected incident, submit
            the system card/runbook/rollback plan, and demonstrate previously unseen tasks to
            reviewers.
