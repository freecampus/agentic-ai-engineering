schema_version: 1
curriculum_version: 1
courses:
  - id: agentic-ai-engineering
    title: Agentic AI Engineering
    status: in-development
    curriculum_version: 1
    home: courses/agentic-ai-engineering/index.qmd
    prerequisite: Project-ready Python or equivalent readiness assessment
    estimated_effort: 240–360 hours plus optional extensions (draft estimate)
    planned_unit_count: 25
    planned_lesson_count: 101
    planned_challenge_count: 25
    available_lesson_count: 0
    available_challenge_count: 0
    completion:
      enabled: false
      recognition: local-self-reported
      rule_version: 1
      lesson_ids: []
      challenge_ids: []
    units:
      - number: 0
        id: launch-agent-lab
        title: Launch a Reproducible Agent Engineering Lab
        phase: Orientation
        status: planned
        overview: courses/agentic-ai-engineering/units/launch-agent-lab/index.qmd
        prerequisite_unit_ids: []
        outcome:
          Run, inspect, and modify a small deterministic agent in Colab; reproduce it locally;
          keep secrets out of artifacts; and distinguish model, runtime, tool, environment, and
          trace evidence.
        estimated_effort: 10–16 hours
        lessons:
          - id: launch-agent-lab.meet-a-tiny-agent
            title: Meet an Agent Through a Tiny Complete Run
            order: 10
            status: planned
            path: courses/agentic-ai-engineering/units/launch-agent-lab/meet-a-tiny-agent.qmd
            summary:
              Run a three-step deterministic agent that reads a task, chooses a calculator
              tool, and returns a result. Learners map every source object to the visible trajectory,
              predict one controlled edit, and repair a malformed tool result.
            evidence:
              annotated event log connecting task, model decision, tool call, observation,
              and final answer.
          - id: launch-agent-lab.learn-with-evidence
            title: Learn with Specifications and Evidence
            order: 20
            status: planned
            path: courses/agentic-ai-engineering/units/launch-agent-lab/learn-with-evidence.qmd
            summary:
              Turn a vague request into a task contract containing success, stop, budget,
              escalation, and forbidden-action rules. Compare a convincing demo with a reproducible
              test and learn why one successful run is not evidence of reliability.
            evidence: task contract plus a prediction/run/explanation record.
          - id: launch-agent-lab.use-ai-responsibly
            title: Use AI Assistance Without Outsourcing Judgment
            order: 30
            status: planned
            path: courses/agentic-ai-engineering/units/launch-agent-lab/use-ai-responsibly.qmd
            summary:
              "Establish a responsible assistance protocol for course work: disclose assistance,
              protect data and credentials, verify generated claims and code, and preserve the learner’s
              own reasoning. Diagnose a confident but unsafe suggested tool implementation."
            evidence: verification checklist and corrected implementation rationale.
          - id: launch-agent-lab.work-in-notebooks
            title: Work Reliably in Colab and Jupyter
            order: 40
            status: planned
            path: courses/agentic-ai-engineering/units/launch-agent-lab/work-in-notebooks.qmd
            summary:
              Inspect notebook state, execution order, package installation, files, runtime
              resets, and reproducibility. Recover a notebook whose apparent success depends on
              stale variables and an unrecorded package version.
            evidence: clean restart-and-run transcript.
          - id: launch-agent-lab.build-local-workspace
            title: Build a Dependable Local Workspace
            order: 50
            status: planned
            path: courses/agentic-ai-engineering/units/launch-agent-lab/build-local-workspace.qmd
            summary:
              Create the course environment with Git, Conda, `Poetry`, Python, pytest, Ruff, type checking,
              and environment-variable configuration on Windows, macOS, or Linux. Run the same smoke
              test locally and in Colab.
            evidence: environment report and passing cross-environment smoke test.
        challenge:
          id: launch-agent-lab.challenge
          title: Prove the Lab Is Ready
          status: planned
          path: courses/agentic-ai-engineering/units/launch-agent-lab/challenge.qmd
          summary:
            Repair a deliberately stale notebook and broken local project, run the tiny
            agent from clean state, reject an unsafe AI-generated fix, and submit a launch card
            containing versions, commands, outputs, and unresolved limitations.
          estimated_time: 90–180 minutes
      - number: 1
        id: choose-agent-architecture
        title: Decide Whether a Problem Needs an Agent
        phase: I. Foundations
        status: planned
        overview: courses/agentic-ai-engineering/units/choose-agent-architecture/index.qmd
        prerequisite_unit_ids:
          - launch-agent-lab
        outcome:
          Distinguish programs, workflows, agents, and multi-agent systems; define degrees
          of autonomy; and select the simplest adequate architecture from evidence.
        estimated_effort: 8–14 hours
        lessons:
          - id: choose-agent-architecture.separate-automation-workflows-and-agents
            title: Separate Automation, Workflows, and Agents
            order: 10
            status: planned
            path: courses/agentic-ai-engineering/units/choose-agent-architecture/separate-automation-workflows-and-agents.qmd
            summary:
              Compare deterministic scripts, DAGs, state machines, LLM workflows, and feedback-driven
              agents. Classify systems by who chooses the next action, what feedback is available,
              and how termination is controlled.
            evidence: classification table with disputed cases and defended criteria.
          - id: choose-agent-architecture.model-the-agent-environment-loop
            title: Model the Agent–Environment Loop
            order: 20
            status: planned
            path: courses/agentic-ai-engineering/units/choose-agent-architecture/model-the-agent-environment-loop.qmd
            summary:
              Represent observations, internal state, actions, environment transitions, objectives,
              costs, and terminal states. Trace a small grid-world and a tool-using assistant through
              the same conceptual loop.
            evidence: state-transition trace and diagram.
          - id: choose-agent-architecture.bound-autonomy-with-task-contracts
            title: Bound Autonomy with Task Contracts
            order: 30
            status: planned
            path: courses/agentic-ai-engineering/units/choose-agent-architecture/bound-autonomy-with-task-contracts.qmd
            summary:
              Translate user intent into measurable success, permissions, budgets, deadlines,
              approval gates, escalation, and forbidden outcomes. Identify underspecified contracts
              that invite unsafe or wasteful behavior.
            evidence: validated task-contract schema and examples.
          - id: choose-agent-architecture.choose-the-simplest-adequate-architecture
            title: Choose the Simplest Adequate Architecture
            order: 40
            status: planned
            path: courses/agentic-ai-engineering/units/choose-agent-architecture/choose-the-simplest-adequate-architecture.qmd
            summary:
              Compare a rule, retrieval query, workflow, single agent, and multi-agent system
              for the same scenario. Calculate the additional failure surface introduced by each
              level of autonomy.
            evidence: architecture decision record with rejection reasons.
        challenge:
          id: choose-agent-architecture.challenge
          title: De-Agentify an Overbuilt System
          status: planned
          path: courses/agentic-ai-engineering/units/choose-agent-architecture/challenge.qmd
          summary:
            Simplify a fictional five-agent customer-request system while preserving required
            behavior. The solution must demonstrate fewer model decisions, lower expected cost,
            and equal or better test performance.
          estimated_time: 90–180 minutes
      - number: 2
        id: probabilistic-models
        title: Treat Language Models as Probabilistic Components
        phase: I. Foundations
        status: planned
        overview: courses/agentic-ai-engineering/units/probabilistic-models/index.qmd
        prerequisite_unit_ids:
          - choose-agent-architecture
        outcome:
          Explain how messages become model outputs, enforce structured responses, measure
          nondeterminism, and select models by evidence and license.
        estimated_effort: 8–14 hours
        lessons:
          - id: probabilistic-models.follow-tokens-messages-and-context
            title: Follow Tokens, Messages, and Context
            order: 10
            status: planned
            path: courses/agentic-ai-engineering/units/probabilistic-models/follow-tokens-messages-and-context.qmd
            summary:
              Inspect tokenization, chat templates, roles, special tokens, and context limits.
              Predict how message ordering and truncation change the model-visible input.
            evidence: rendered prompt/context report without hidden reasoning collection.
          - id: probabilistic-models.control-sampling-and-nondeterminism
            title: Control Sampling and Nondeterminism
            order: 20
            status: planned
            path: courses/agentic-ai-engineering/units/probabilistic-models/control-sampling-and-nondeterminism.qmd
            summary:
              Experiment with temperature, top-p, seeds, and repeated runs. Separate reproducibility
              of code and inputs from reproducibility of hosted model outputs.
            evidence: distribution of outcomes across repeated trials.
          - id: probabilistic-models.make-outputs-machine-checkable
            title: Make Outputs Machine-Checkable
            order: 30
            status: planned
            path: courses/agentic-ai-engineering/units/probabilistic-models/make-outputs-machine-checkable.qmd
            summary:
              Move from prose parsing to JSON Schema, typed validation, constrained decoding,
              and repair or rejection policies. Test malformed, partial, and semantically invalid
              outputs.
            evidence: schema-validation suite and failure taxonomy.
          - id: probabilistic-models.compare-open-models-responsibly
            title: Compare Open Models Responsibly
            order: 40
            status: planned
            path: courses/agentic-ai-engineering/units/probabilistic-models/compare-open-models-responsibly.qmd
            summary:
              Distinguish open weights, source, data, and licenses; inspect model cards;
              and evaluate small models on a narrow course task. Avoid choosing from benchmark headlines
              alone.
            evidence: model-selection card containing license, hardware, quality, latency, and limitations.
        challenge:
          id: probabilistic-models.challenge
          title: Build a Reliable Decision Component
          status: planned
          path: courses/agentic-ai-engineering/units/probabilistic-models/challenge.qmd
          summary:
            Create a typed routing component backed by a fake model and at least one open
            model. It must reject invalid outputs, expose uncertainty through observable signals,
            and pass a repeated-run evaluation.
          estimated_time: 90–180 minutes
      - number: 3
        id: minimal-agent-runtime
        title: Build a Minimal Agent Runtime
        phase: I. Foundations
        status: planned
        overview: courses/agentic-ai-engineering/units/minimal-agent-runtime/index.qmd
        prerequisite_unit_ids:
          - probabilistic-models
        outcome:
          Implement a framework-free, typed agent loop with explicit state, events, budgets,
          termination, and deterministic tests.
        estimated_effort: 8–14 hours
        lessons:
          - id: minimal-agent-runtime.represent-state-and-events-explicitly
            title: Represent State and Events Explicitly
            order: 10
            status: planned
            path: courses/agentic-ai-engineering/units/minimal-agent-runtime/represent-state-and-events-explicitly.qmd
            summary:
              Design typed task, message, tool-call, observation, budget, and result records.
              Compare mutable hidden state with an append-only event history and derived state.
            evidence: serialized trajectory that can be inspected and replayed.
          - id: minimal-agent-runtime.implement-the-decide-act-observe-loop
            title: Implement the Decide–Act–Observe Loop
            order: 20
            status: planned
            path: courses/agentic-ai-engineering/units/minimal-agent-runtime/implement-the-decide-act-observe-loop.qmd
            summary:
              Write the smallest complete agent loop in plain Python. Trace normal execution,
              a tool error, and a model request for an unavailable capability.
            evidence: tested runtime with fake model and tool ports.
          - id: minimal-agent-runtime.make-termination-and-budgets-enforceable
            title: Make Termination and Budgets Enforceable
            order: 30
            status: planned
            path: courses/agentic-ai-engineering/units/minimal-agent-runtime/make-termination-and-budgets-enforceable.qmd
            summary:
              Add maximum steps, time, tokens, cost, repeated-action detection, and explicit
              success/failure states. Diagnose loops that merely ask the model to stop itself.
            evidence: tests proving every budget terminates execution.
          - id: minimal-agent-runtime.stream-cancel-and-handle-async-work
            title: Stream, Cancel, and Handle Async Work
            order: 40
            status: planned
            path: courses/agentic-ai-engineering/units/minimal-agent-runtime/stream-cancel-and-handle-async-work.qmd
            summary:
              Introduce async model/tool calls, progress events, cancellation, deadlines,
              and cleanup. Repair a runtime that leaks a task after cancellation.
            evidence: cancellation and timeout integration tests.
        challenge:
          id: minimal-agent-runtime.challenge
          title: Complete the Transparent Runtime
          status: planned
          path: courses/agentic-ai-engineering/units/minimal-agent-runtime/challenge.qmd
          summary:
            Extend a partial runtime to survive malformed decisions, tool timeouts, repeated
            actions, cancellation, and budget exhaustion while preserving a complete event log.
          estimated_time: 90–180 minutes
      - number: 4
        id: reason-plan-verify
        title: Reason, Search, Plan, and Verify
        phase: I. Foundations
        status: planned
        overview: courses/agentic-ai-engineering/units/reason-plan-verify/index.qmd
        prerequisite_unit_ids:
          - minimal-agent-runtime
        outcome:
          Compare direct response, ReAct-style interaction, planning, reflection, and search;
          then choose a strategy using quality, latency, and cost evidence.
        estimated_effort: 8–14 hours
        lessons:
          - id: reason-plan-verify.connect-agent-reasoning-to-search-and-decision-processes
            title: Connect Agent Reasoning to Search and Decision Processes
            order: 10
            status: planned
            path: courses/agentic-ai-engineering/units/reason-plan-verify/connect-agent-reasoning-to-search-and-decision-processes.qmd
            summary:
              Use state spaces, actions, transition uncertainty, heuristics, and partial
              observability to explain agent behavior. Relate MDP/POMDP ideas to tool-using systems
              without requiring a full formal treatment.
            evidence: formalized small task and search tree.
          - id: reason-plan-verify.interleave-reasoning-and-acting
            title: Interleave Reasoning and Acting
            order: 20
            status: planned
            path: courses/agentic-ai-engineering/units/reason-plan-verify/interleave-reasoning-and-acting.qmd
            summary:
              Implement a ReAct-like loop using concise external action rationales rather
              than collecting private chain-of-thought. Detect action drift and unsupported conclusions.
            evidence: trajectory grader for action relevance and observation use.
          - id: reason-plan-verify.separate-planning-from-execution
            title: Separate Planning from Execution
            order: 30
            status: planned
            path: courses/agentic-ai-engineering/units/reason-plan-verify/separate-planning-from-execution.qmd
            summary:
              Build planner–executor behavior with plan validation, revision, and state updates.
              Test plans against unavailable tools, hidden dependencies, and changing observations.
            evidence: plan schema and revision tests.
          - id: reason-plan-verify.add-reflection-and-search-only-when-they-help
            title: Add Reflection and Search Only When They Help
            order: 40
            status: planned
            path: courses/agentic-ai-engineering/units/reason-plan-verify/add-reflection-and-search-only-when-they-help.qmd
            summary:
              Compare critique/revision, verifier loops, best-of-N, and tree search. Measure
              cases where extra inference increases confidence, latency, or correlated error without
              improving success.
            evidence: quality–latency–cost comparison.
        challenge:
          id: reason-plan-verify.challenge
          title: Ship a Transparent Research Assistant
          status: planned
          path: courses/agentic-ai-engineering/units/reason-plan-verify/challenge.qmd
          summary:
            Build a framework-free assistant with two read-only tools, typed state, citations,
            budgets, tests, traces, and a deterministic baseline. Submit an evaluation showing
            whether agentic control adds value.
          estimated_time: 90–180 minutes
      - number: 5
        id: tool-capability-boundaries
        title: Design Tools as Capability Boundaries
        phase: II. Tools and knowledge
        status: planned
        overview: courses/agentic-ai-engineering/units/tool-capability-boundaries/index.qmd
        prerequisite_unit_ids:
          - reason-plan-verify
        outcome:
          Create typed, least-privilege tools with clear semantics for validation, errors,
          retries, idempotency, side effects, and authorization.
        estimated_effort: 8–14 hours
        lessons:
          - id: tool-capability-boundaries.write-tool-contracts-models-can-use
            title: Write Tool Contracts Models Can Use
            order: 10
            status: planned
            path: courses/agentic-ai-engineering/units/tool-capability-boundaries/write-tool-contracts-models-can-use.qmd
            summary:
              Design names, descriptions, schemas, examples, preconditions, and postconditions
              that separate model-facing affordances from implementation details. Measure how ambiguous
              schemas affect tool selection.
            evidence: contract tests and selection evaluation.
          - id: tool-capability-boundaries.normalize-errors-timeouts-and-cancellation
            title: Normalize Errors, Timeouts, and Cancellation
            order: 20
            status: planned
            path: courses/agentic-ai-engineering/units/tool-capability-boundaries/normalize-errors-timeouts-and-cancellation.qmd
            summary:
              Create a tool-result envelope distinguishing invalid input, denied action,
              transient failure, permanent failure, partial result, timeout, and cancellation. Prevent
              raw stack traces or secrets from entering model context.
            evidence: error-mapping test matrix.
          - id: tool-capability-boundaries.make-retries-and-side-effects-safe
            title: Make Retries and Side Effects Safe
            order: 30
            status: planned
            path: courses/agentic-ai-engineering/units/tool-capability-boundaries/make-retries-and-side-effects-safe.qmd
            summary:
              Separate queries from commands; introduce idempotency keys, deduplication,
              retry policies, and compensation. Diagnose a duplicate-charge scenario caused by naive
              retry.
            evidence: proof that repeated delivery causes one intended effect.
          - id: tool-capability-boundaries.enforce-least-privilege-and-approval
            title: Enforce Least Privilege and Approval
            order: 40
            status: planned
            path: courses/agentic-ai-engineering/units/tool-capability-boundaries/enforce-least-privilege-and-approval.qmd
            summary:
              Scope credentials and tools by task, resource, action, and time. Add policy
              checks and human confirmation for high-impact, irreversible, or externally visible
              operations.
            evidence: authorization table and denied-action traces.
        challenge:
          id: tool-capability-boundaries.challenge
          title: Harden a Ticketing Toolset
          status: planned
          path: courses/agentic-ai-engineering/units/tool-capability-boundaries/challenge.qmd
          summary:
            Repair tools that expose secrets, retry unsafe actions, mix errors with data,
            and grant excessive access. Pass contract, fault-injection, and authorization tests.
          estimated_time: 90–180 minutes
      - number: 6
        id: context-engineering
        title: Engineer Context Instead of Concatenating Prompts
        phase: II. Tools and knowledge
        status: planned
        overview: courses/agentic-ai-engineering/units/context-engineering/index.qmd
        prerequisite_unit_ids:
          - tool-capability-boundaries
        outcome:
          Assemble a bounded, provenance-aware context from instructions, state, data,
          and tool results while managing conflicts, trust, and compression.
        estimated_effort: 8–14 hours
        lessons:
          - id: context-engineering.classify-context-by-purpose-and-trust
            title: Classify Context by Purpose and Trust
            order: 10
            status: planned
            path: courses/agentic-ai-engineering/units/context-engineering/classify-context-by-purpose-and-trust.qmd
            summary:
              Separate system policy, developer instruction, user request, retrieved data,
              tool output, memory, and generated scratch artifacts. Resolve priority without treating
              untrusted content as instruction.
            evidence: context manifest with source and trust labels.
          - id: context-engineering.select-and-order-the-working-set
            title: Select and Order the Working Set
            order: 20
            status: planned
            path: courses/agentic-ai-engineering/units/context-engineering/select-and-order-the-working-set.qmd
            summary:
              Implement relevance, recency, authority, diversity, and token-budget rules.
              Test lost-in-the-middle behavior and ordering sensitivity.
            evidence: context-selection evaluation.
          - id: context-engineering.compress-without-inventing-state
            title: Compress Without Inventing State
            order: 30
            status: planned
            path: courses/agentic-ai-engineering/units/context-engineering/compress-without-inventing-state.qmd
            summary:
              Compare truncation, extractive selection, structured summaries, and hierarchical
              compression. Preserve decisions, unresolved questions, provenance, and constraints
              across compression.
            evidence: compression fidelity tests.
          - id: context-engineering.detect-conflict-contamination-and-context-rot
            title: Detect Conflict, Contamination, and Context Rot
            order: 40
            status: planned
            path: courses/agentic-ai-engineering/units/context-engineering/detect-conflict-contamination-and-context-rot.qmd
            summary:
              Introduce conflicting instructions, stale records, and malicious retrieved
              text. Build policies for exclusion, quarantine, user clarification, and source-aware
              disagreement.
            evidence: adversarial context suite.
        challenge:
          id: context-engineering.challenge
          title: Rescue an Overloaded Context Window
          status: planned
          path: courses/agentic-ai-engineering/units/context-engineering/challenge.qmd
          summary:
            Reduce an oversized, contradictory context while maintaining task success and
            citations. Demonstrate lower token usage and equal or better held-out performance.
          estimated_time: 90–180 minutes
      - number: 7
        id: grounded-retrieval
        title: Build Grounded Retrieval and Research Agents
        phase: II. Tools and knowledge
        status: planned
        overview: courses/agentic-ai-engineering/units/grounded-retrieval/index.qmd
        prerequisite_unit_ids:
          - context-engineering
        outcome:
          Build and evaluate hybrid retrieval, reranking, multi-hop research, provenance,
          citation verification, freshness, and abstention.
        estimated_effort: 8–14 hours
        lessons:
          - id: grounded-retrieval.build-lexical-dense-and-hybrid-retrieval
            title: Build Lexical, Dense, and Hybrid Retrieval
            order: 10
            status: planned
            path: courses/agentic-ai-engineering/units/grounded-retrieval/build-lexical-dense-and-hybrid-retrieval.qmd
            summary:
              Index an openly licensed corpus and compare BM25-style lexical, dense vector,
              and hybrid retrieval. Diagnose semantic similarity that ignores an exact critical
              term.
            evidence: retrieval metrics and per-query error analysis.
          - id: grounded-retrieval.chunk-filter-and-rerank-deliberately
            title: Chunk, Filter, and Rerank Deliberately
            order: 20
            status: planned
            path: courses/agentic-ai-engineering/units/grounded-retrieval/chunk-filter-and-rerank-deliberately.qmd
            summary:
              Test chunk boundaries, metadata filters, parent/child retrieval, and reranking.
              Link each design choice to answerability rather than generic similarity.
            evidence: ablation table.
          - id: grounded-retrieval.plan-multi-hop-and-structured-research
            title: Plan Multi-Hop and Structured Research
            order: 30
            status: planned
            path: courses/agentic-ai-engineering/units/grounded-retrieval/plan-multi-hop-and-structured-research.qmd
            summary:
              Combine document retrieval with SQL or another structured-data tool. Track
              subquestions, evidence gaps, and stopping conditions without endlessly searching.
            evidence: research-plan trace with gap status.
          - id: grounded-retrieval.verify-claims-citations-freshness-and-abstention
            title: Verify Claims, Citations, Freshness, and Abstention
            order: 40
            status: planned
            path: courses/agentic-ai-engineering/units/grounded-retrieval/verify-claims-citations-freshness-and-abstention.qmd
            summary:
              Separate citation presence from citation support. Check claim entailment, source
              authority, dates, conflicting evidence, and insufficient evidence.
            evidence: claim-level citation audit.
        challenge:
          id: grounded-retrieval.challenge
          title: Produce an Auditable Research Brief
          status: planned
          path: courses/agentic-ai-engineering/units/grounded-retrieval/challenge.qmd
          summary:
            Answer a multi-source question with hybrid retrieval, structured data, claim-level
            provenance, freshness checks, and justified abstention. Hidden tests include misleading
            and contradictory sources.
          estimated_time: 90–180 minutes
      - number: 8
        id: agent-memory
        title: Build Memory That Earns Its Cost
        phase: II. Tools and knowledge
        status: planned
        overview: courses/agentic-ai-engineering/units/agent-memory/index.qmd
        prerequisite_unit_ids:
          - grounded-retrieval
        outcome:
          Design working, episodic, semantic, and procedural memory with controlled writes,
          retrieval, consolidation, privacy, deletion, and poisoning defenses.
        estimated_effort: 8–14 hours
        lessons:
          - id: agent-memory.separate-memory-types-and-lifecycles
            title: Separate Memory Types and Lifecycles
            order: 10
            status: planned
            path: courses/agentic-ai-engineering/units/agent-memory/separate-memory-types-and-lifecycles.qmd
            summary:
              Map working state, event history, user facts, learned procedures, and cached
              artifacts to distinct stores and lifetimes. Avoid treating the entire transcript as
              memory.
            evidence: memory architecture and retention table.
          - id: agent-memory.decide-what-may-be-written
            title: Decide What May Be Written
            order: 20
            status: planned
            path: courses/agentic-ai-engineering/units/agent-memory/decide-what-may-be-written.qmd
            summary:
              Implement consent, validation, salience, confidence, source, TTL, and sensitivity
              policies. Reject speculative or sensitive facts from automatic long-term storage.
            evidence: memory-write policy tests.
          - id: agent-memory.retrieve-consolidate-and-resolve-contradictions
            title: Retrieve, Consolidate, and Resolve Contradictions
            order: 30
            status: planned
            path: courses/agentic-ai-engineering/units/agent-memory/retrieve-consolidate-and-resolve-contradictions.qmd
            summary:
              Rank memories by relevance, authority, recency, and confidence; consolidate
              duplicates; surface conflicts. Compare synchronous and background consolidation.
            evidence: longitudinal memory benchmark.
          - id: agent-memory.protect-inspect-correct-and-delete-memory
            title: Protect, Inspect, Correct, and Delete Memory
            order: 40
            status: planned
            path: courses/agentic-ai-engineering/units/agent-memory/protect-inspect-correct-and-delete-memory.qmd
            summary:
              Add user inspection, correction, export, deletion, and poisoning detection.
              Verify deletion across indexes, caches, and summaries.
            evidence: deletion and poisoning audit.
        challenge:
          id: agent-memory.challenge
          title: Ship a Grounded Knowledge Worker
          status: planned
          path: courses/agentic-ai-engineering/units/agent-memory/challenge.qmd
          summary:
            Extend the research assistant with evaluated hybrid retrieval, bounded memory,
            provenance, and user-controlled deletion. Show that memory improves a longitudinal
            task without harming privacy or contradiction handling.
          estimated_time: 90–180 minutes
      - number: 9
        id: agentic-design-patterns
        title: Compose Agentic Design Patterns
        phase: III. Architecture
        status: planned
        overview: courses/agentic-ai-engineering/units/agentic-design-patterns/index.qmd
        prerequisite_unit_ids:
          - agent-memory
        outcome:
          Implement and compare chaining, routing, parallelization, orchestrator–worker,
          evaluator–optimizer, reflection, and state-machine patterns.
        estimated_effort: 8–14 hours
        lessons:
