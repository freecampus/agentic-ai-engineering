  description:
    Learn to build, evaluate, defend, and operate agentic systems. Curriculum in
    development.
  site-url: https://freecampus.github.io/agentic-ai-engineering/
  repo-url: https://github.com/freecampus/agentic-ai-engineering
  repo-actions:
    - edit
    - issue
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: true
  bread-crumbs: false
