groups:
  environment:
    tasks:
      check:
        help: Require Python and Poetry to use the same activated Conda environment
        run: python scripts/check_environment.py
  plan:
    tasks:
      check:
        help: Local only; validate ignored lesson plan briefs, records, and dashboard
        run: python scripts/check_lesson_plan.py
      refresh:
        help: Local only; refresh ignored lesson plan totals without changing task states
        run: python scripts/check_lesson_plan.py --refresh
  all:
    tasks:
      ci:
        help: Validate code, package, site, and generated notebooks
        run: python scripts/project.py all
  tests:
    tasks:
      linter:
        help: Check formatting, lint, and types without modifying Git hooks
        run: python scripts/project.py lint
      unit:
        help: Run the test suite
        run: python scripts/project.py test
      ci:
        help: Run the full validation pipeline
        run: python scripts/project.py all
  docs:
    tasks:
      review:
        help: Render drafts and notebooks into docs/_review, never public _site
        run: python scripts/project.py review
      build:
        help: Render Quarto, then export Colab notebooks
        run: python scripts/project.py docs
      render:
        help: Alias for docs.build
        run: python scripts/project.py docs
      preview:
        help: Build and preview the site
        run: python scripts/project.py preview
  package:
    tasks:
      build:
        help: Build distributions with Poetry
        run: python scripts/project.py package
  clean:
    tasks:
      tmp:
        help: Remove generated output without touching environments or source
        run: python scripts/project.py clean
